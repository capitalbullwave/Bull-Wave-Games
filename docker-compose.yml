version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bullwave_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 4234
      POSTGRES_DB: kheladda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bullwave_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bullwave_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=4234
      - POSTGRES_DB=kheladda
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=prod_fallback_signing_token_key_123_change_me
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bullwave_celery_worker
    restart: always
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=4234
      - POSTGRES_DB=kheladda
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - db

volumes:
  pgdata:
